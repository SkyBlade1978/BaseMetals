                || configuredReleaseIdentity.forgeInstallerSha256 != '9434C29790504DCD11CE97CB30DD8891B4B18848982357BC1B5ABFA79FB95103'
                || configuredReleaseIdentity.mappingChannel != 'official'
                || configuredReleaseIdentity.mappingVersion != '1.18.2'
                || configuredReleaseIdentity.loaderName != 'forge'
                || configuredReleaseIdentity.loaderCode != '1'
                || configuredReleaseIdentity.javaVersion != '17'
                || configuredReleaseIdentity.gradleJavaVersion != '17'
                || configuredReleaseIdentity.curseForgeProjectId != '240967') {
