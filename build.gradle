def packagedServerStartupSmoke = tasks.register('packagedServerStartupSmoke', Exec) {
    group = 'verification'
    description = 'Starts an official Forge dedicated server with the exact packaged release jars.'
    dependsOn preparePackagedServerSmoke
    doFirst {
        File runtime = requireRuntimeDirectory(packagedForgeServerRuntime, 'packagedForgeServerRuntime')
        File libraries = new File(runtime, 'libraries')
        File forgeDirectory = new File(libraries, 'net/minecraftforge/forge/1.18.2-40.3.0')
        File launcher = new File(forgeDirectory, 'forge-1.18.2-40.3.0-server.jar')
        File sourceArguments = new File(forgeDirectory,
                System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
                        ? 'win_args.txt' : 'unix_args.txt')
        [launcher, sourceArguments, libraries].each {
            if (!it.exists()) throw new GradleException("Incomplete official server runtime: ${it}")
        }
        File runDirectory = packagedServerRunDirectory.get().asFile
        File absoluteArguments = new File(runDirectory, 'forge-server-args.txt')
        String libraryPath = libraries.canonicalPath.replace('\\', '/') + '/'
        absoluteArguments.setText(sourceArguments.getText('UTF-8')
                .replace('libraries/', libraryPath)
                .replace('-DlibraryDirectory=libraries',
                        "-DlibraryDirectory=${libraries.canonicalPath}"), 'UTF-8')
        workingDir runDirectory
        commandLine java17Launcher.get().executablePath.asFile.absolutePath,
                '-Xms512m', '-Xmx2g', "@${absoluteArguments.absolutePath}", 'nogui'
    }
    doLast {
        File runDirectory = packagedServerRunDirectory.get().asFile
        File marker = new File(runDirectory, 'packaged-server-smoke-pass.properties')
        if (!marker.isFile()) throw new GradleException('Packaged dedicated-server completion marker is missing')
        Properties values = new Properties()
        marker.withInputStream { values.load(it) }
        if (values.getProperty('basemetals') != '3.0.1.118021'
                || values.getProperty('orespawn') != '4.0.16.118021'
                || values.getProperty('forge') != '40.3.0') {
            throw new GradleException("Packaged dedicated-server versions are wrong: ${values}")
        }
        verifyPackagedLog(runDirectory, 'BASEMETALS_PACKAGED_SERVER_SMOKE PASS',
                'Packaged dedicated-server smoke')
    }
}

