def forbiddenReleasePath = { String entryName ->
    String name = entryName.replace('\\', '/').toLowerCase(Locale.ROOT)
    name.startsWith('com/mcmoddev/')
            || name.startsWith('ci-fixtures/')
            || name.startsWith('reference/')
            || name.startsWith('agent-notes/')
            || name.contains('/agent-notes/')
            || name.startsWith('src/gametest/')
            || name.startsWith('src/integratedsmoke/')
            || name.startsWith('src/packagedclientsmoke/')
            || name.startsWith('src/upgradesmoke/')
            || name.startsWith('src/packagedserversmoke/')
            || name.contains('minecraft-mavenizer')
            || name.contains('gametests.class')
            || name.contains('/smoke/')
            || name.endsWith('/oregenerator.class')
            || name.endsWith('/worldgenerator.class')
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Audits the deterministic release jars and their production-only contents.'
    dependsOn tasks.named('verifyReleaseConfiguration')
    dependsOn tasks.named('verifyReleaseDependencies')
    dependsOn tasks.named('verifyMavenCoordinates')
    dependsOn tasks.named('assemble')
    doLast {
        File libs = file("${buildDir}/libs")
        def actual = fileTree(libs) { include 'BaseMetals-*.jar' }.files.collect { it.name }.sort()
        def expected = expectedReleaseNames.sort()
        if (actual != expected) {
            throw new GradleException("Expected exactly ${expected}, found ${actual}")
        }
        expectedReleaseNames.each { artifactName ->
            new ZipFile(new File(libs, artifactName)).withCloseable { zip ->
                def leaked = zip.entries().toList().find { forbiddenReleasePath(it.name) }
                if (leaked != null) {
                    throw new GradleException("${artifactName} contains validation, fixture, legacy, or agent-only path ${leaked.name}")
                }
            }
        }

        File main = new File(libs, mainReleaseName)
        new ZipFile(main).withCloseable { zip ->
            def names = zip.entries().toList().collect { it.name } as Set
            [
                    'META-INF/mods.toml',
                    'META-INF/MANIFEST.MF',
                    'pack.mcmeta',
                    'data/basemetals/orespawn/provider.json',
                    'data/basemetals/recipes/stone_crackhammer.json',
                    'data/forge/loot_modifiers/global_loot_modifiers.json',
                    'assets/basemetals/lang/en_us.json',
                    'META-INF/basemetals/docs/VERSIONS.md',
                    'META-INF/basemetals/docs/schemas/orespawn-4.0.16/orespawn-provider.schema.json'
            ].each { required ->
                if (!names.contains(required)) throw new GradleException("Release jar is missing ${required}")
            }
            def manifest = new java.util.jar.Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')))
            if (manifest.mainAttributes.getValue('Maven-Artifact') != expectedMavenCoordinate) {
                throw new GradleException('Release manifest contains the wrong Maven coordinate')
            }
            String expectedBuildTarget = 'minecraft-1.18.2-forge-40.3.0-java-17'
            if (manifest.mainAttributes.getValue('Build-Target') != expectedBuildTarget) {
                throw new GradleException('Release manifest contains the wrong stable build target')
            }
            String modsToml = zip.getInputStream(zip.getEntry('META-INF/mods.toml')).getText('UTF-8')
            if (modsToml.contains('${')
                    || !modsToml.contains('version="3.0.1.118021"')
                    || !modsToml.contains('versionRange="[4.0.1,5.0.0)"')) {
                throw new GradleException('Release mods.toml contains unresolved or incompatible metadata')
            }
            def provider = new JsonSlurper().parse(zip.getInputStream(
                    zip.getEntry('data/basemetals/orespawn/provider.json')))
            if (provider.schema_version != 3 || provider.provider_revision != 1
                    || provider.provider_modid != 'basemetals') {
                throw new GradleException('OreSpawn provider schema/revision identity changed')
            }
            def locales = names.findAll { it ==~ /assets\/basemetals\/lang\/.+\.json/ }
            if (locales.size() != 18) {
                throw new GradleException("Release jar must contain all 18 language files, found ${locales.size()}")
            }
            if (names.any { it.endsWith('.class') && (it.contains('/gametest/')
                    || it.contains('/smoke/') || it.startsWith('com/mcmoddev/')) }) {
                throw new GradleException('Release jar contains validation or legacy implementation classes')
            }
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    description = 'Writes SHA-256 checksums for exactly the three release jars.'
    dependsOn tasks.named('verifyReleaseArtifacts')
    doLast {
        File output = file("${buildDir}/release/SHA256SUMS")
        output.parentFile.mkdirs()
        output.setText(expectedReleaseNames.sort().collect { name ->
            "${sha256(file("${buildDir}/libs/${name}")).toLowerCase(Locale.ROOT)}  ${name}"
        }.join('\n') + '\n', 'UTF-8')
    }
}

tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    description = 'Verifies the immutable artifact bundle supplied to Maven publication.'
    inputs.files {
        preparedReleaseDir == null ? [] :
                (expectedReleaseNames + ['SHA256SUMS', 'CHANGELOG.txt']).collect {
                    new File(preparedReleaseDir.toString(), it)
                }
    }
    doLast {
        if (preparedReleaseDir == null) {
            throw new GradleException('preparedReleaseDir is required for prepared artifact publication')
        }
        File prepared = file(preparedReleaseDir.toString())
        if (!prepared.isDirectory()) throw new GradleException("Prepared release directory does not exist: ${prepared}")
        def expectedBundle = (expectedReleaseNames + ['SHA256SUMS', 'CHANGELOG.txt']).sort()
        def actualBundle = prepared.listFiles().findAll { it.isFile() }.collect { it.name }.sort()
        if (actualBundle != expectedBundle) {
            throw new GradleException("Expected prepared bundle ${expectedBundle}, found ${actualBundle}")
        }
        def declared = [:]
        new File(prepared, 'SHA256SUMS').readLines('UTF-8').findAll { !it.trim().isEmpty() }.each { line ->
            def match = line =~ /^([0-9a-fA-F]{64})  (.+)$/
            if (!match.matches()) throw new GradleException("Invalid prepared checksum line: ${line}")
            declared[match[0][2]] = match[0][1].toUpperCase(Locale.ROOT)
        }
        if (declared.keySet().sort() != expectedReleaseNames.sort()) {
            throw new GradleException('Prepared checksums do not declare exactly the three release jars')
        }
        declared.each { name, expectedHash ->
            if (sha256(new File(prepared, name)) != expectedHash) {
                throw new GradleException("Prepared checksum mismatch for ${name}")
            }
        }
    }
}

tasks.register('validateMavenReleaseCredentials') {
