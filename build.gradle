tasks.register('verifyReleaseDependencies') {
    group = 'verification'
    description = 'Resolves and verifies the exact released OreSpawn qualification dependency.'
    doLast {
        if (configuredOreSpawnIdentity.version != '4.0.16.118021'
                || configuredOreSpawnIdentity.curseProjectId != '245586'
                || configuredOreSpawnIdentity.curseFileId != '8780769'
                || configuredOreSpawnIdentity.sha256 != '76FD6140FE85C3D9EEA0321A0441D352A0B2643390A1090BBB1F70FE104C5717') {
            throw new GradleException('Unexpected OreSpawn release coordinates')
        }
        File artifact = configurations.orespawnRelease.resolvedConfiguration.resolvedArtifacts
                .find { it.moduleVersion.id.group == 'curse.maven' && it.file.name.endsWith('.jar') }?.file
        if (artifact == null || !artifact.isFile()) {
            throw new GradleException('Released OreSpawn artifact did not resolve')
        }
        String actual = sha256(artifact)
        if (actual != configuredOreSpawnIdentity.sha256) {
            throw new GradleException("OreSpawn SHA-256 mismatch: ${actual}")
        }
    }
