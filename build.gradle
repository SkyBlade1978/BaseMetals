tasks.register('verifyJava17Toolchain') {
    group = 'verification'
    description = 'Verifies the exact Java product toolchain used for Base Metals compilation.'
    dependsOn tasks.named('compileJava')
    doLast {
        def metadata = tasks.named('compileJava', JavaCompile).get().javaCompiler.get().metadata
        if (configuredJavaToolchainVersion != '17.0.1+12'
                || metadata.languageVersion.asInt() != 17
                || metadata.jvmVersion != configuredJavaToolchainVersion
                || !metadata.vendor.toString().toLowerCase(Locale.ROOT).contains('temurin')) {
            throw new GradleException("Expected Eclipse Temurin ${configuredJavaToolchainVersion}, found " +
                    "${metadata.vendor} ${metadata.jvmVersion} at ${metadata.installationPath}")
        }
    }
}

tasks.register('verifyMavenCoordinates') {
    group = 'verification'
    description = 'Verifies the generated POM uses the Base Metals release namespace.'
    dependsOn tasks.named('generatePomFileForMavenJavaPublication')
    doLast {
        File pomFile = file("${buildDir}/publications/mavenJava/pom-default.xml")
        if (!pomFile.isFile()) throw new GradleException("Generated Maven POM does not exist: ${pomFile}")
        def pom = new XmlSlurper(false, false).parse(pomFile)
        def actual = [pom.groupId.text(), pom.artifactId.text(), pom.version.text()]
        def expected = [expectedMavenGroup, expectedMavenArtifact, configuredReleaseVersion]
        if (configuredReleaseGroup != expectedMavenGroup || actual != expected) {
            throw new GradleException("Expected Maven coordinate ${expected.join(':')}, found ${actual.join(':')}")
        }
    }
}

tasks.register('verifyMavenizerCompatibilityFixture') {
    group = 'verification'
    description = 'Verifies the checksum-sealed Forge 1.18.2 Mavenizer compatibility fixture.'
    inputs.file mavenizerCompatibilityJar
    doLast {
        File fixture = mavenizerCompatibilityJar.asFile
        if (!fixture.isFile()) throw new GradleException("Missing Mavenizer compatibility fixture: ${fixture}")
        String actual = sha256(fixture)
        if (actual != mavenizerCompatibilitySha256) {
            throw new GradleException("Mavenizer compatibility fixture checksum mismatch: ${actual}")
